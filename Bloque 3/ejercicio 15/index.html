<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Responsivo - Mobile First</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contenedor-layout">
    <header class="header">
      <h1>Encabezado del Sitio</h1>
    </header>

    <aside class="sidebar">
      <h3>Menú / Sidebar</h3>
      <p>Este panel es visible solo en pantallas de 768px o más.</p>
    </aside>

    <main class="contenido-principal">
      <h2>Contenido Principal</h2>
      <p>En pantallas menores a 768px, el sidebar se oculta y este contenido ocupa todo el ancho del grid (1 sola columna).</p>
    </main>

    <footer class="footer">
      <p>Pie de página</p>
    </footer>
  </div>

</body>
</html>
