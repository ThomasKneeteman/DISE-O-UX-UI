<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Dinámica con CSS Grid Dense</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* Estructura principal de la Galería */
    .galeria {
      display: grid;
      /* Generación automática de columnas de mínimo 180px */
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      /* Filas de altura fija implícita */
      grid-auto-rows: 180px;
      /* Reorganización densa: rellena huecos vacíos automáticamente */
      grid-auto-flow: dense;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Contenedor individual de cada ítem */
    .item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background-color: #2a2a2a;
    }

    .item img {
      width: 100%;
      height: 100%;
      /* Mantiene la proporción visual sin deformar la imagen */
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .item:hover img {
      transform: scale(1.05);
    }

    /* Modificadores de tamaño para dinamismo */
    
    /* Elemento destacado: ocupa 2 columnas y 2 filas */
    .item.grande {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* Elemento ancho: ocupa 2 columnas y 1 fila */
    .item.ancho {
      grid-column: span 2;
    }

    /* Elemento alto: ocupa 1 columna y 2 filas */
    .item.alto {
      grid-row: span 2;
    }

    /* Ajuste para pantallas pequeñas */
    @media (max-width: 480px) {
      .item.grande,
      .item.ancho {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <main class="galeria">
    <!-- Elemento 1: Estándar (1x1) -->
    <article class="item">
      <img src="https://picsum.photos/400/400?random=1" alt="Imagen 1">
    </article>

    <!-- Elemento 2: Grande (2x2) - Requisito cumplido -->
    <article class="item grande">
      <img src="https://picsum.photos/800/800?random=2" alt="Imagen Destacada 2">
    </article>

    <!-- Elemento 3: Alto (1x2) -->
    <article class="item alto">
      <img src="https://picsum.photos/400/800?random=3" alt="Imagen Alta 3">
    </article>

    <!-- Elementos adicionales para completar el mosaico armónico -->
    <article class="item">
      <img src="https://picsum.photos/400/400?random=4" alt="Imagen 4">
    </article>

    <article class="item ancho">
      <img src="https://picsum.photos/800/400?random=5" alt="Imagen Ancha 5">
    </article>

    <article class="item">
      <img src="https://picsum.photos/400/400?random=6" alt="Imagen 6">
    </article>

    <article class="item alto">
      <img src="https://picsum.photos/400/800?random=7" alt="Imagen Alta 7">
    </article>

    <article class="item grande">
      <img src="https://picsum.photos/800/800?random=8" alt="Imagen Destacada 8">
    </article>

    <article class="item">
      <img src="https://picsum.photos/400/400?random=9" alt="Imagen 9">
    </article>

    <article class="item ancho">
      <img src="https://picsum.photos/800/400?random=10" alt="Imagen Ancha 10">
    </article>
  </main>

</body>
</html>
